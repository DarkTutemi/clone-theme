<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .header h2 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-label {
      color: #94a3b8;
    }
    .status-value {
      font-weight: 600;
      color: #10b981;
    }
    .btn-toggle {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      transition: background 0.15s;
    }
    .btn-toggle:hover {
      background: #1d4ed8;
    }
    .btn-toggle.active {
      background: #059669;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .link-btn {
      background: #1e293b;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 11px;
      padding: 8px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      display: block;
      transition: all 0.15s;
    }
    .link-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .hotkey-hint {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 3px;
      font-family: monospace;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Theme Inspector</h2>
    <span class="badge">v1.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Bridge Server:</span>
      <span id="bridge-status" class="status-value">Đang kiểm tra...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Shopify Store:</span>
      <span class="status-value" style="color: #38bdf8;">g1spma-ku</span>
    </div>
  </div>

  <button id="btn-toggle-inspect" class="btn-toggle">
    <span>🎯 Bật / Tắt Inspect DOM</span>
  </button>

  <div class="links-grid">
    <a href="http://localhost:4000/" target="_blank" class="link-btn">
      🖥️ Mở Localhost
    </a>
    <a href="https://g1spma-ku.myshopify.com/?preview_theme_id=191338185071" target="_blank" class="link-btn">
      👁️ Shopify Preview
    </a>
  </div>

  <div class="hotkey-hint">
    Phím tắt: <span class="kbd">Alt</span> + <span class="kbd">I</span> trên trang web
  </div>

  <script src="popup.js"></script>
</body>
</html>
